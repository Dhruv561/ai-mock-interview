<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ElevenLabs Convai spike</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    #status { font-size: 14px; color: #555; margin-bottom: 12px; }
    #status.speaking { color: #b45309; }
    #status.listening { color: #15803d; }
    button { font-size: 14px; padding: 8px 16px; margin-right: 8px; }
    #log { border: 1px solid #ddd; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 14px; }
    #log p { margin: 4px 0; }
    #log .agent { color: #1d4ed8; }
    #log .user { color: #444; }
    #log .sys { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <h1>ElevenLabs Conversational AI — interviewer spike (throwaway)</h1>
  <p id="status">idle</p>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <div id="log"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
