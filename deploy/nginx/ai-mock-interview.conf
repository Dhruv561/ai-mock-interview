# AI Mock Interview backend. Dedicated port (not 80/443) so this can't
# collide with the existing default_server/other vhosts on this box while
# no subdomain is assigned yet. *.housepoints.com.au is already covered by
# the existing wildcard cert, so moving this to a real subdomain + TLS
# later is just a new server block + DNS record, no new certbot run needed.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Interview sessions are long-lived WebSocket connections; the
        # default proxy_read_timeout (60s) would silently kill an idle one.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
